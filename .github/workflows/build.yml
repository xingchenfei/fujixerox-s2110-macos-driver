name: Build & Test Fuji Xerox DocuCentre S2110 macOS Driver

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: macos-14 # GitHub official Apple Silicon Mac (M1/M2)
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile Native Mach-O Universal Binaries (Anti-Reverse Hardened)
        run: |
          echo "=== 正在编译原生 Mach-O Universal 双架构二进制程序 ==="
          mkdir -p build/filters
          mkdir -p build/bin
          
          # 1. 编译核心过滤器 rastertohbpl.c 为 Universal Binary (arm64 + x86_64) 并剥离符号
          clang -O3 src/rastertohbpl.c -target arm64-apple-macos11 -framework IOKit -framework CoreFoundation -o build/filters/filter_arm64
          clang -O3 src/rastertohbpl.c -target x86_64-apple-macos10.15 -framework IOKit -framework CoreFoundation -o build/filters/filter_x86_64
          lipo -create build/filters/filter_arm64 build/filters/filter_x86_64 -output build/filters/rastertohbpl
          strip -S -x build/filters/rastertohbpl
          file build/filters/rastertohbpl

          # 2. 编译向导授权加密助手 auth_helper.c 为 Universal Binary 并进行完全符号剥离
          clang -O3 src/auth_helper.c -target arm64-apple-macos11 -o build/bin/helper_arm64
          clang -O3 src/auth_helper.c -target x86_64-apple-macos10.15 -o build/bin/helper_x86_64
          lipo -create build/bin/helper_arm64 build/bin/helper_x86_64 -output build/bin/auth_helper
          strip -S -x build/bin/auth_helper
          file build/bin/auth_helper

      - name: Run Diagnostics & HBPL Protocol Self-Test
        run: |
          echo "=== 正在执行滤镜转译与 HBPL 协议自检 ==="
          cp build/filters/rastertohbpl tests/
          chmod +x tests/rastertohbpl
          XEROX_TEST_MODE=1 python3 tests/test_print.py

      - name: Validate PPD Specification
        run: |
          echo "=== 正在使用 cupstestppd 验证 PPD 规范 ==="
          sudo mkdir -p /Library/Printers/FujiXerox/Filters
          sudo cp build/filters/rastertohbpl /Library/Printers/FujiXerox/Filters/
          cupstestppd ppd/fujixerox-docucentre-s2110.ppd

      - name: Assemble Native GUI Wizard App & DMG Root
        run: |
          echo "=== 正在组装 DMG 镜像根目录与向导 App ==="
          DMG_ROOT="build/dmg_root"
          mkdir -p "${DMG_ROOT}"
          
          APP_NAME="富士施乐打印机一键配置向导.app"
          APP_PATH="${DMG_ROOT}/${APP_NAME}"
          mkdir -p "${APP_PATH}/Contents/MacOS"
          mkdir -p "${APP_PATH}/Contents/Resources"
          mkdir -p "${APP_PATH}/Contents/SharedSupport/filters"
          mkdir -p "${APP_PATH}/Contents/SharedSupport/ppd"
          
          # 放入 Universal 过滤器二进制
          cp build/filters/rastertohbpl "${APP_PATH}/Contents/SharedSupport/filters/"
          chmod 755 "${APP_PATH}/Contents/SharedSupport/filters/rastertohbpl"
          
          # 放入 Universal 向导授权加密助手 (抹除密钥与 2FA 明文)
          cp build/bin/auth_helper "${APP_PATH}/Contents/MacOS/"
          chmod 755 "${APP_PATH}/Contents/MacOS/auth_helper"
          
          # 放入 PPD
          cp ppd/fujixerox-docucentre-s2110.ppd "${APP_PATH}/Contents/SharedSupport/ppd/"
          chmod 644 "${APP_PATH}/Contents/SharedSupport/ppd/fujixerox-docucentre-s2110.ppd"
          
          # 放入元数据与脚本
          cp assets/Info.plist "${APP_PATH}/Contents/"
          cp assets/app.icns "${APP_PATH}/Contents/Resources/"
          cp scripts/main_launcher "${APP_PATH}/Contents/MacOS/main"
          chmod 755 "${APP_PATH}/Contents/MacOS/main"
          
          # 构建卸载程序 App
          UNINSTALL_APP="${DMG_ROOT}/卸载驱动.app"
          mkdir -p "${UNINSTALL_APP}/Contents/MacOS"
          mkdir -p "${UNINSTALL_APP}/Contents/Resources"
          cp assets/uninstaller_Info.plist "${UNINSTALL_APP}/Contents/Info.plist"
          cp assets/app.icns "${UNINSTALL_APP}/Contents/Resources/"
          cp scripts/uninstaller_main "${UNINSTALL_APP}/Contents/MacOS/main"
          chmod 755 "${UNINSTALL_APP}/Contents/MacOS/main"
          
          # 放入便捷命令行脚本与文档
          cp scripts/install.command "${DMG_ROOT}/双击安装驱动.command"
          cp scripts/uninstall.command "${DMG_ROOT}/双击卸载驱动.command"
          chmod +x "${DMG_ROOT}/双击安装驱动.command" "${DMG_ROOT}/双击卸载驱动.command"
          
          cp README.md "${DMG_ROOT}/"
          cp "富士施乐_DocuCentre_S2110_Mac驱动使用说明.html" "${DMG_ROOT}/"

      - name: Build macOS Standard DMG Image
        run: |
          echo "=== 正在构建 macOS 标准 DMG 磁盘镜像 ==="
          hdiutil create -volname "FujiXerox_S2110" \
                         -srcfolder "build/dmg_root" \
                         -ov -format UDZO \
                         "FujiXerox_DocuCentre_S2110_Mac_Driver.dmg"
          ls -lh FujiXerox_DocuCentre_S2110_Mac_Driver.dmg

      - name: Upload Driver DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FujiXerox_DocuCentre_S2110_Commercial_Driver
          path: FujiXerox_DocuCentre_S2110_Mac_Driver.dmg

      - name: Create GitHub Release v1.2.0
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.0
          name: "Fuji Xerox DocuCentre S2110 macOS Commercial Driver (独立研发纯C重构版) v1.2.0"
          body: |
            ### 富士施乐 (Fuji Xerox) DocuCentre S2110 macOS 专用独立研发驱动 (DMG 安装包)
            
            - **作者亲自编写与调优的高性能 C 语言原生驱动套件**；
            - **集成一机一码防盗版授权体系**：
              - 硬件主板 UUID 物理强绑定（IOKit / IOPlatformUUID）；
              - 7 天动态时效 2FA 离线激活码机制；
              - 授权验证助手全量编译为符号剥离的 Mach-O 原生机器码，私钥内存动态解密；
            - **无需加装 PostScript (PS) 硬件扩展卡**，原生支持 HBPL 协议；
            - **原生 Universal Mach-O 二进制**：完整适配 Apple Silicon (M1/M2/M3/M4) 与 Intel 架构；
            - **高清矢量渲染**：锁定 600 DPI 纯黑矢量输出，字迹锐利无毛刺发灰；
            - **原生图形化向导**：配备双击图形配置向导 App，支持网络与 USB 一键自动配置注册。
          files: |
            FujiXerox_DocuCentre_S2110_Mac_Driver.dmg
